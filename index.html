<title>TT Dumpling Shop · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23e8382f'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%A5%9F%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🥟', '#e8382f');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --gold: #ffc21a;
    --red: #e8382f;
    --deep: #a8170f;
    --pink: #ff3d7f;
    --mint: #3fe0b0;
    --cream: #fff4dc;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --opt: clamp(64px, 13vmin, 112px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #3a1d14; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  img.ico { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .emo { line-height: 1; pointer-events: none; }

  .bigbtn {
    width: clamp(66px, 12vmin, 100px); height: clamp(66px, 12vmin, 100px); border-radius: 26px;
    font-size: clamp(32px, 6vmin, 50px); line-height: 1; display: grid; place-items: center;
    background: linear-gradient(160deg, #ffffff, #ffeccc); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #ff6b5b, #d8261c); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn:active, .day:active, .who button:active, .lvl button:active, .ibtn:active, .buddybtn:active, .opt:active, .serve:active, .buy:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: 46px; height: 46px; border-radius: 14px; font-size: 22px; line-height: 1; flex-shrink: 0;
    display: grid; place-items: center; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.45);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.8vh, 16px); padding: 12px; transition: opacity 0.3s; }
  @media (min-aspect-ratio: 11/10) { #home { left: 40vw; right: 0; top: 0; bottom: 0; padding-right: max(12px, var(--safe-r)); } }
  @media (max-aspect-ratio: 11/10) { #home { left: 0; right: 0; bottom: calc(var(--safe-b) + 6px); height: 62vh; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.9; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(22px, 4.4vmin, 40px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(36px, 8.4vmin, 84px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(232, 56, 47, .8); letter-spacing: 1px; white-space: nowrap; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: clamp(4px, 1vmin, 10px); width: min(100%, 760px); }
  @media (max-aspect-ratio: 11/10) { .days { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .day {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: clamp(4px, 1vmin, 10px) 3px; border-radius: 18px; border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink);
    background: radial-gradient(circle at 50% 30%, #ffffff88, transparent 60%), #ffcf7a; color: var(--ink); min-height: clamp(64px, 12vmin, 112px);
    transition: transform 0.12s;
  }
  .day .pic { width: clamp(30px, 6.4vmin, 56px); height: clamp(30px, 6.4vmin, 56px); display: grid; grid-template: 100% / 100%; place-items: center; font-size: clamp(24px, 5vmin, 44px); }
  .day .nm { font-family: var(--display); font-size: clamp(8px, 1.45vmin, 13px); line-height: 1.05; text-align: center; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .day .st { font-size: clamp(9px, 1.6vmin, 13px); line-height: 1; letter-spacing: -1px; min-height: 1em; }
  .day.lock { filter: grayscale(0.9) brightness(0.8); }
  .day.lock::after { content: '🔒'; position: absolute; top: -8px; right: -6px; font-size: 18px; }
  .day.on { transform: scale(1.08); border-color: var(--yellow); background: radial-gradient(circle at 50% 30%, #ffffffaa, transparent 60%), #ffe14d; box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink), 0 0 24px 6px rgba(255, 212, 0, .7); z-index: 2; }
  .who { display: flex; gap: clamp(8px, 2vmin, 16px); }
  .who button {
    position: relative; display: flex; align-items: center; gap: 6px; height: clamp(54px, 9.6vmin, 82px); padding: 0 14px 0 6px; border-radius: 22px;
    border: 4px solid #fff; background: rgba(20, 18, 31, 0.6); box-shadow: 0 5px 0 var(--ink); font-family: var(--display); font-size: clamp(12px, 2.3vmin, 19px);
  }
  .who img { height: 84%; aspect-ratio: 1; border-radius: 16px; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffb02e); }
  .who .duo { display: flex; height: 84%; }
  .who .duo img { height: 100%; }
  .who .duo img + img { margin-left: -14px; }
  .who button.on { background: linear-gradient(160deg, #ffe680, #ffb02e); color: var(--ink); border-color: var(--yellow); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); }
  .homerow { display: flex; align-items: center; gap: clamp(8px, 2vmin, 18px); flex-wrap: wrap; justify-content: center; }
  .lvls { display: flex; gap: 8px; }
  .lvl { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 20px; background: rgba(20, 18, 31, 0.6); border: 3px solid #fff; }
  .lvl img { width: clamp(32px, 5.6vmin, 46px); height: clamp(32px, 5.6vmin, 46px); border-radius: 12px; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffb02e); }
  .lvl button { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: clamp(52px, 8.6vmin, 74px); height: clamp(46px, 8vmin, 66px); border-radius: 14px; font-family: var(--display); font-size: clamp(9px, 1.6vmin, 12px); line-height: 1.1; opacity: 0.6; }
  .lvl button span { font-size: clamp(20px, 3.8vmin, 30px); }
  .lvl button.on { opacity: 1; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .sq { width: clamp(52px, 9vmin, 72px); height: clamp(52px, 9vmin, 72px); border-radius: 20px; font-size: clamp(24px, 4.4vmin, 34px); position: relative; }
  .sq b { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font: 400 11px/16px var(--display); background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 0 5px; white-space: nowrap; }
  @media (max-height: 430px) {
    #home { gap: 5px; padding: 6px 8px; }
    .logo small { font-size: 16px; -webkit-text-stroke-width: 2px; text-shadow: 0 2px 0 var(--ink); }
    .logo big { font-size: 30px; -webkit-text-stroke-width: 3px; text-shadow: 0 3px 0 var(--ink); }
    .day { min-height: 54px; border-radius: 14px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
    .day .pic { width: 26px; height: 26px; font-size: 22px; }
    .who button { height: 46px; font-size: 11px; border-radius: 16px; border-width: 3px; }
    .lvl button { height: 42px; min-width: 46px; }
    .lvl img { width: 28px; height: 28px; }
    .sq { width: 46px; height: 46px; font-size: 22px; }
    .bigbtn { width: 58px; height: 58px; font-size: 28px; border-radius: 18px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
  }

  /* ---------- the orders along the top ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  #orders { position: absolute; left: calc(max(10px, var(--safe-l)) + 58px); right: calc(max(10px, var(--safe-r)) + 60px); top: calc(var(--safe-t) + 14px); display: flex; justify-content: center; gap: clamp(8px, 1.4vmin, 14px); }
  .card {
    position: relative; width: clamp(78px, 15vmin, 132px); border-radius: 18px; background: var(--cream); color: var(--ink);
    border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink); padding: 4px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform 0.2s, opacity 0.3s; animation: pop 0.4s cubic-bezier(.3, 1.8, .5, 1);
  }
  .card .face { position: absolute; left: -8px; top: -10px; font-size: clamp(22px, 4.6vmin, 38px); line-height: 1; filter: drop-shadow(0 2px 0 rgba(20,18,31,.4)); }
  .card .plate { display: flex; align-items: center; justify-content: center; width: 100%; height: clamp(34px, 7vmin, 60px); }
  .card .plate .pic { height: 100%; aspect-ratio: 1; display: grid; grid-template: 100% / 100%; place-items: center; }
  .card .plate b { font-family: var(--display); font-weight: 400; font-size: clamp(14px, 2.8vmin, 24px); }
  .card .with { display: flex; gap: 3px; align-items: center; justify-content: center; }
  .card .with span { width: clamp(24px, 5vmin, 42px); height: clamp(24px, 5vmin, 42px); display: grid; grid-template: 100% / 100%; place-items: center; font-size: clamp(18px, 3.8vmin, 32px); border-radius: 10px; background: #fff; border: 2px solid rgba(20,18,31,.15); }
  .card .bar { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 5px; border-radius: 3px; background: rgba(20,18,31,.15); overflow: hidden; }
  .card .bar i { display: block; height: 100%; background: #3fe0b0; transform-origin: left; }
  .card .bar i.low { background: #ff8a1f; }
  .card .who { position: absolute; right: -8px; top: -10px; width: clamp(24px, 4.6vmin, 38px); height: clamp(24px, 4.6vmin, 38px); border-radius: 50%; border: 3px solid #fff; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffb02e); overflow: hidden; display: grid; place-items: center; font-size: 16px; }
  .card .who img { width: 100%; height: 100%; }
  .card .who:empty { display: none; }
  .card.mine { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); transform: translateY(2px); }
  .card.ready { animation: glow 1s ease-in-out infinite; }
  .card.gone { opacity: 0; transform: scale(0.6); }
  .hudright { position: absolute; right: max(10px, var(--safe-r)); top: calc(var(--safe-t) + 8px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
  .coins { font: 400 clamp(13px, 2.4vmin, 18px)/1 var(--display); background: rgba(20, 18, 31, 0.6); border: 3px solid #fff; border-radius: 14px; padding: 5px 8px; white-space: nowrap; pointer-events: none; }
  .coins.bump { animation: bump 0.4s; }
  @keyframes bump { 40% { transform: scale(1.25); background: #ffd400; color: var(--ink); } }

  /* ---------- cooker timers and ready plates, over the stove ---------- */
  .timer { position: fixed; z-index: 6; width: clamp(40px, 7vmin, 60px); height: clamp(40px, 7vmin, 60px); margin: -20px 0 0 -20px; border-radius: 50%; display: grid; place-items: center; font-size: clamp(20px, 3.6vmin, 30px); pointer-events: none;
    background: conic-gradient(#ffd400 calc(var(--k, 0) * 1turn), rgba(20,18,31,.55) 0); border: 3px solid #fff; transform: translate(-50%, -50%); margin: 0; }
  .timer.ready { pointer-events: auto; background: #ffd400; border-color: #fff; box-shadow: 0 4px 0 var(--ink); animation: glow 0.9s ease-in-out infinite; width: clamp(54px, 9vmin, 76px); height: clamp(54px, 9vmin, 76px); font-size: clamp(28px, 5vmin, 40px); }
  .timer.over { background: #ff8a1f; }
  .coinpop { position: fixed; z-index: 7; transform: translate(-50%, -50%); font: 400 clamp(18px, 3.8vmin, 32px) var(--display); color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; pointer-events: none; animation: rise 1.3s ease-out forwards; white-space: nowrap; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -160%); } }

  /* ---------- each cook's board: the step and its picture buttons ---------- */
  #pads { position: fixed; inset: 0; pointer-events: none; z-index: 7; }
  .panel {
    position: absolute; bottom: calc(var(--safe-b) + 8px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  }
  .panel .step { display: flex; align-items: center; gap: 8px; font: 400 clamp(13px, 2.6vmin, 22px) var(--display); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
  .panel .pips { display: flex; gap: 4px; }
  .panel .pips i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid var(--ink); }
  .panel .pips i.on { background: var(--yellow); }
  .panel .tray { display: flex; gap: 2px; padding: 2px 6px; border-radius: 12px; background: rgba(20,18,31,.55); border: 2px solid #fff; }
  .panel .tray img { width: 24px; height: 24px; opacity: 0.3; }
  .panel .tray img.on { opacity: 1; }
  .panel .row { display: flex; gap: clamp(8px, 1.8vmin, 16px); align-items: flex-end; }
  .opt {
    position: relative; width: var(--opt); height: var(--opt); border-radius: 24px; padding: 10%; pointer-events: auto; touch-action: none;
    background: linear-gradient(170deg, #ffffff, #ffe8bf); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); display: grid; grid-template: 100% / 100%; place-items: center; font-size: calc(var(--opt) * 0.55);
  }
  .opt.down { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .opt.hint { animation: glow 0.9s ease-in-out infinite; border-color: var(--yellow); }
  .opt.no { animation: shake 0.35s; background: #ffd0d0; }
  .opt .badge { position: absolute; right: -6px; bottom: -6px; font-size: calc(var(--opt) * 0.3); line-height: 1; }
  .opt kbd, .serve kbd, .buddybtn kbd { position: absolute; left: -6px; top: -6px; min-width: 24px; height: 24px; border-radius: 8px; background: #fff; color: var(--ink); font: 400 13px/18px var(--display); text-align: center; border: 3px solid var(--ink); padding: 0 3px; }
  .serve {
    position: relative; width: calc(var(--opt) * 0.92); height: calc(var(--opt) * 0.92); border-radius: 50%; pointer-events: auto; font-size: calc(var(--opt) * 0.46);
    background: rgba(20, 18, 31, 0.5); border: 5px solid rgba(255,255,255,.6); box-shadow: 0 6px 0 var(--ink); display: grid; place-items: center; opacity: 0.55;
  }
  .serve.on { opacity: 1; background: linear-gradient(160deg, #ffe680, #ffb02e); border-color: #fff; animation: glow 0.9s ease-in-out infinite; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes glow { 50% { box-shadow: 0 0 28px 8px rgba(255, 212, 0, 0.95), 0 6px 0 var(--ink); } }
  @keyframes pop { from { transform: scale(0.4); } }
  @media (hover: none) and (pointer: coarse) { .opt kbd, .serve kbd, .buddybtn kbd { display: none; } }
  @media (max-height: 430px) {
    :root { --opt: 58px; }
    .panel { gap: 3px; }
    .panel .tray { display: none !important; }
    .opt { border-radius: 18px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
    #orders { top: calc(var(--safe-t) + 10px); }
    .card { width: 66px; padding: 3px 3px 7px; border-radius: 14px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
    .card .plate { height: 26px; }
    .card .plate b { font-size: 13px; }
    .card .with span { width: 22px; height: 22px; font-size: 15px; border-radius: 7px; }
    .card .face { font-size: 20px; }
  }

  .buddybtn {
    position: fixed; z-index: 7; border-radius: 50%; padding: 4px; right: calc(max(10px, var(--safe-r)) + 4px); bottom: calc(var(--safe-b) + 14px);
    width: clamp(60px, 11vmin, 86px); height: clamp(60px, 11vmin, 86px);
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); font-size: clamp(28px, 5vmin, 40px);
  }
  .buddybtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .buddybtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  #fiveBtn { right: auto; left: 50%; transform: translateX(-50%); }
  #fiveBtn:active { transform: translate(-50%, 5px); }

  /* ---------- toasts, the opening ---------- */
  #toasts { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 94vw; }
  .toast { font-family: var(--display); font-size: clamp(17px, 3.8vmin, 34px); color: var(--yellow); text-align: center; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 2.2s ease-out forwards; }
  .toast.buddy { color: #ffb02e; }
  .toast.treat, .toast.thanks { color: #fff; }
  .toast.good { color: #7df7c8; }
  .toast.oops { color: #ff9db0; font-size: clamp(15px, 3.2vmin, 26px); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  #bigCount { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 9; pointer-events: none; opacity: 0; font-family: var(--display); font-size: clamp(50px, 14vmin, 130px); color: var(--yellow); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 9px 0 var(--ink); white-space: nowrap; }
  #bigCount.anim { animation: count 1.2s ease-out forwards; }
  @keyframes count { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } }

  /* ---------- overlays: pause, results, story, shop ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(20, 18, 31, 0.4); transition: opacity 0.25s; padding: 12px; }
  .box { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 14px); padding: clamp(14px, 3vmin, 26px); border-radius: 34px; background: linear-gradient(170deg, #fff8e6, #ffe2b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; max-height: 94vh; overflow: auto; }
  .rbtns { display: flex; gap: clamp(10px, 2.6vmin, 22px); flex-wrap: wrap; justify-content: center; }

  @media (min-aspect-ratio: 11/10) { #results { left: 42vw; } }

  .rhead { font-family: var(--display); font-size: clamp(22px, 5vmin, 42px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); text-align: center; line-height: 1.05; animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }

  .stars i.off { filter: grayscale(1) opacity(0.35); }
  .rrows { display: flex; flex-direction: column; gap: 5px; width: 100%; min-width: min(320px, 80vw); }
  .rrow { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.75); border: 3px solid rgba(20, 18, 31, 0.15); font-weight: 800; font-size: clamp(13px, 2.4vmin, 18px); }
  .rrow b { font-family: var(--display); font-weight: 400; margin-left: auto; white-space: nowrap; }
  .rnew { font-family: var(--display); font-size: 13px; color: #fff; background: var(--pink); border: 2px solid var(--ink); border-radius: 9px; padding: 1px 7px; transform: rotate(-4deg); }
  @media (max-height: 430px) { .box { gap: 5px; padding: 10px 14px; border-radius: 24px; border-width: 4px; } .rrow { padding: 2px 10px; } .stars { font-size: 26px; } .bigbtn { width: 54px; height: 54px; font-size: 26px; border-radius: 16px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); } }

  #story .box { width: min(640px, 96vw); text-align: center; }
  .shead { font-family: var(--display); font-size: clamp(18px, 4.2vmin, 32px); color: var(--red); }
  .sart { font-size: clamp(52px, 12vmin, 104px); line-height: 1.05; letter-spacing: 4px; animation: pop 0.45s cubic-bezier(.3, 1.8, .5, 1); }
  .stext { font-weight: 800; font-size: clamp(15px, 3.1vmin, 23px); line-height: 1.35; max-width: 560px; min-height: 4em; }
  .sdots { display: flex; gap: 8px; }
  .sdots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(20, 18, 31, 0.18); }
  .sdots i.on { background: var(--red); }
  #story .ibtn, #shop .ibtn { color: #fff; background: var(--ink); width: 56px; height: 56px; font-size: 26px; border-radius: 18px; }
  @media (max-height: 430px) { .sart { font-size: 42px; } .stext { font-size: 14px; min-height: 0; } #story .ibtn, #shop .ibtn { width: 46px; height: 46px; } }

  #shop .box { width: min(560px, 96vw); }
  .ups { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .up { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 18px; background: rgba(255,255,255,.8); border: 3px solid rgba(20,18,31,.15); }
  .up .pic { width: clamp(40px, 8vmin, 56px); height: clamp(40px, 8vmin, 56px); display: grid; grid-template: 100% / 100%; place-items: center; font-size: clamp(30px, 6vmin, 44px); flex-shrink: 0; }

<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home: pick a day, who cooks and how hard, then ▶ -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="days" id="days" role="radiogroup" aria-label="Pick a day"></div>
  <div class="who" id="who" role="radiogroup" aria-label="Who's cooking?">
    <button data-who="teddy" aria-label="Teddy cooks"><img alt=""><span>TEDDY</span></button>
    <button data-who="tommy" aria-label="Tommy cooks"><img alt=""><span>TOMMY</span></button>
    <button data-who="both" aria-label="Teddy and Tommy cook"><span class="duo"><img alt=""><img alt=""></span><span>BOTH</span></button>
  </div>
  <div class="homerow">
    <div class="lvls" id="lvls"></div>
    <button class="ibtn sq" id="storyBtn" title="The story (B)" aria-label="The story">📖</button>
    <button class="ibtn sq" id="shopBtn" title="Shop upgrades (U)" aria-label="Shop upgrades">🏪<b id="shopCoins"></b></button>
    <button class="bigbtn go" id="playBtn" title="Open the shop! (Enter)" aria-label="Open the shop!">▶</button>
  </div>
</div>

<!-- while cooking -->
<div id="hud" class="hidden">
  <div id="orders"></div>
  <div class="hudright">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
    <div class="coins" id="coins"></div>
  </div>
</div>
<div id="timers"></div>
<div id="pads" class="hidden"></div>
<button class="buddybtn hidden" id="buddyBtn" aria-label="Call your brother"><img id="buddyFace" alt=""><kbd>T</kbd></button>
<button class="buddybtn hidden" id="fiveBtn" aria-label="High five">✋<kbd>T</kbd></button>

<div id="toasts"></div>
<div id="bigCount"></div>

<div id="pause" class="overlay hidden">
  <div class="box">
    <button class="bigbtn go" id="pResume" aria-label="Keep cooking">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start the day again">🔁</button>
    <button class="bigbtn" id="pHome" aria-label="Days">🏠</button>
  </div>
</div>

<div id="results" class="overlay hidden">
  <div class="box">
    <div class="rhead" id="rHead"></div>
    <div class="stars" id="rStars"></div>
    <div class="rrows" id="rRows"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="rAgain" aria-label="Play again">🔁</button>
      <button class="bigbtn" id="rNext" aria-label="Next day">⏭️</button>
      <button class="bigbtn" id="rShop" aria-label="Shop upgrades">🏪</button>
      <button class="bigbtn" id="rHome" aria-label="Days">🏠</button>
    </div>
  </div>
</div>

<div id="story" class="overlay hidden">
  <div class="box">
    <div class="shead">DUMPLINGS FOR THE NEW YEAR</div>
    <div class="sart" id="sArt"></div>
    <div class="stext" id="sText"></div>
    <div class="sdots" id="sDots"></div>
    <div class="rbtns">
      <button class="ibtn" id="sPrev" aria-label="Back a page">◀</button>
      <button class="ibtn" id="sNext" aria-label="Next page">▶</button>
      <button class="ibtn" id="sClose" aria-label="Close the story">✖</button>
    </div>
  </div>
</div>

<div id="shop" class="overlay hidden">
  <div class="box">
    <div class="shead">SHOP UPGRADES</div>
    <div class="wallet" id="wallet"></div>
    <div class="ups" id="ups"></div>
    <button class="ibtn" id="shopClose" aria-label="Close the shop">✖</button>
  </div>
</div>

<div id="loading"><span>🥟</span></div>

<script src="kit/three.min.js"></script>
<script src="kit/gfx.js"></script>
<script src="kit/people.js"></script>
<script src="kit/roster.js"></script>
<script src="kit/portraits.js"></script>
<script src="kit/sound.js"></script>
<script src="kit/lang.js"></script>
<script src="kit/help.js"></script>
<script src="js/title.js"></script>
<script src="js/recipes.js"></script>
<script src="js/shop.js"></script>
<script src="js/checks.js"></script>
<script src="js/icons.js"></script>
<script src="js/sfx.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/keys.js"></script>
<script src="js/zh.js"></script>
</body>
